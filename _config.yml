# Build settings

port: 4000
markdown:  kramdown
permalink: /:title
plugins:   [jekyll-sitemap, jekyll-feed,  jekyll-seo-tag]

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)

title:		   "Tundra Toucan"
description: "Custom black metal and death metal logos, album covers and merch art by Gerrit Rijken (Tundra Toucan)."
url:         "https://tundratoucan.github.io"
lang:        "en"
author:      "Gerrit Rijken"

# Genre Guide: the old Markdown versions are replaced by the new
# GENREGUIDE/, REFERENCES/ and per-genre folders, so skip building them.
